# Lint and test on every push.
#
# The suite is entirely offline - no GeeLark credentials, no spreadsheet, no
# phone - so it needs no secrets and can never spend money. Anything that talks
# to a real device is verified by running the tool, not here.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version pyproject claims to support, and the one used for
        # development. A gap between them is worth finding here rather than on
        # someone else's machine.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: The CLI must work without any configuration
        # `geelark --help` is the first thing anyone runs, and it has to survive
        # a machine with no .env at all.
        run: geelark --help
