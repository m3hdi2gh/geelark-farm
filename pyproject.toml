[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geelark-farm"
version = "0.1.0"
description = "Provision GeeLark cloud phones from a spreadsheet: create behind a proxy, sign into Google, install an app, verify, stop."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyotp>=2.9",
    "gspread>=6.0",
    "google-auth>=2.28",
    "rich>=13.7",
    # The Postgres store (stage 1 of the sheet retirement). Imported only
    # behind STORE_ENABLED, so the package costs nothing on a box that has
    # not opted in - but it ships in the image like any dependency.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # For auditing the suite rather than for running it. Coverage says which
    # lines nothing touches; `scripts/mutate.py` says which of the lines
    # something touches are actually held - the only question that matters
    # about a test.
    #
    # That harness is in the repo and needs nothing installed. mutmut was
    # listed here for months and never ran once: it exits 1 on Windows, which
    # is the only machine this is developed on, and it pulled libcst, textual
    # and setproctitle into every CI install on both Python versions to do it.
    "pytest-cov>=5.0",
]

[project.scripts]
geelark = "geelark_farm.cli:main"

[tool.setuptools.package-data]
# schema.sql rides inside the wheel; store.db reads it via importlib.resources.
"geelark_farm.store" = ["*.sql"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `tests.test_pools` imports the way `geelark_farm` does.
#
# Without it the suite passes locally and cannot even be collected in CI, and
# for three weeks it was not: `python -m pytest` puts the working directory on
# sys.path and bare `pytest` does not, so the green run everyone saw and the
# red one GitHub saw were running different code. Sixty-eight red runs, one
# missing line (2026-08-23).
#
# Here rather than a `tests/__init__.py` because it fixes the cause instead of
# the one import that happened to expose it.
pythonpath = ["."]
