[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geelark-farm"
version = "0.1.0"
description = "Provision GeeLark cloud phones from a spreadsheet: create behind a proxy, sign into Google, install an app, verify, stop."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyotp>=2.9",
    "gspread>=6.0",
    "google-auth>=2.28",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
geelark = "geelark_farm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
