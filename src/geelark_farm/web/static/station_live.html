<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title><link rel="icon" href="{{FAVICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{CSS}}"><meta name="gf-rev" content="{{REV}}">
<script src="{{JS}}" defer></script></head>
<body data-page="live" data-serial="{{SERIAL}}" class="on-live">
<section class="lt {{LANE}}" id="live" data-power="ready" aria-label="Phone {{SERIAL}}">
  <div class="lt-stage" id="lt-stage"><div class="lt-col" id="lt-col">
    <header class="lt-bar" id="lt-bar">{{BRAND}}<span class="sep"></span><span class="ph">Phone {{SERIAL}}</span></header>
    <div class="lt-box" id="lt-box">
      <iframe id="lt-view" hidden title="Phone {{SERIAL}}" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
      <div class="lt-screen" id="lt-screen"></div>
      <div class="lt-tools" id="lt-tools" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M16 12h5"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9a9 9 0 0 1 3-4"/><path d="M21 15a9 9 0 0 1-3 4"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="6.5"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></div>
    </div></div></div>
  <aside class="lt-side {{LANE}}" id="lt-side" data-state="off" tabindex="-1" aria-label="Phone {{SERIAL}}"></aside>
</section>
<div class="said" id="said" role="status" aria-live="polite"></div>
<input type="hidden" id="gf-csrf" name="csrf" value="{{CSRF}}">
{{ICONS}}
<script type="application/json" id="gf-state">{{STATE}}</script>
</body></html>
